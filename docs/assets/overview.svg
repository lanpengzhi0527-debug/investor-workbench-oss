  <text x="48" y="112" font-family="Arial, sans-serif" font-size="15" fill="#111111">Overview</text>
  <text x="48" y="146" font-family="Arial, sans-serif" font-size="15" fill="#666666">Portfolio</text>
  <text x="48" y="180" font-family="Arial, sans-serif" font-size="15" fill="#666666">Research</text>
  <text x="48" y="214" font-family="Arial, sans-serif" font-size="15" fill="#666666">Decisions</text>
  <text x="48" y="248" font-family="Arial, sans-serif" font-size="15" fill="#666666">Data Health</text>
