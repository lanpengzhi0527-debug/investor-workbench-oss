    <text x="304" y="360" font-size="14" fill="#111111">NOVA</text><text x="440" y="360" font-size="14" fill="#666666">Compute infrastructure</text>
    <text x="304" y="400" font-size="14" fill="#111111">MEMX</text><text x="440" y="400" font-size="14" fill="#666666">Memory systems</text>
    <text x="304" y="440" font-size="14" fill="#111111">GRID</text><text x="440" y="440" font-size="14" fill="#666666">Power infrastructure</text>
